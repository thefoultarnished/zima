<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1><span class="dot"></span>Send to Zima</h1>

  <section id="send">
    <button id="send-button">Send this page</button>
    <p class="hint">Select text first to send just that.</p>
  </section>

  <section id="setup">
    <label for="token">Token from Zima → Settings → Web clipper</label>
    <div class="row">
      <input id="token" type="password" autocomplete="off" placeholder="Paste token">
      <button id="save" class="secondary">Save</button>
    </div>
  </section>

  <p id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
